name: CI

on:
   push:
      branches: [main]
   pull_request:

concurrency:
   group: ci-${{ github.ref }}
   cancel-in-progress: true

jobs:
   changeset:
      if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changeset')
      runs-on: ubuntu-latest
      timeout-minutes: 5
      steps:
         - uses: actions/checkout@v4
           with:
              fetch-depth: 0

         - name: Require a changeset
           run: |
              changed=$(git diff --name-only "origin/main...HEAD" -- .changeset | grep -E '^\.changeset/[^/]+\.md$' | grep -v 'README\.md' || true)
              if [ -n "$changed" ]; then
                echo "Changeset present:"
                echo "$changed"
              else
                echo "::error::No changeset found. Run 'pnpm changeset' and commit the generated file, or apply the 'skip-changeset' label."
                exit 1
              fi

   verify:
      runs-on: ubuntu-latest
      timeout-minutes: 20
      env:
         TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      steps:
         - uses: actions/checkout@v4

         - uses: pnpm/action-setup@v4

         - uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: pnpm

         - run: pnpm install --frozen-lockfile

         - run: pnpm format:check
         - run: pnpm lint
         - run: pnpm check-types
         - run: pnpm test
         - run: pnpm build:all
         - run: pnpm pack:email
         - run: tar -tzf artifacts/*.tgz

         - run: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc --outdir .wrangler/dry
           env:
              CLOUDFLARE_API_TOKEN: unused-for-dry-run

   e2e:
      runs-on: ubuntu-latest
      timeout-minutes: 25
      env:
         TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      steps:
         - uses: actions/checkout@v4

         - uses: pnpm/action-setup@v4

         - uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: pnpm

         - run: pnpm install --frozen-lockfile
         - run: pnpm lint:e2e
         - run: pnpm check-types:e2e

         - uses: actions/cache@v4
           with:
              path: ~/.cache/ms-playwright
              key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

         - run: pnpm exec playwright install --with-deps chromium

         - run: pnpm e2e

         - uses: actions/upload-artifact@v4
           if: failure()
           with:
              name: playwright-report
              path: |
                 playwright-report
                 test-results
              retention-days: 7
